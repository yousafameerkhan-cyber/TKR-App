<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TKR Restaurant - Login</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .login-card { background: white; padding: 25px; border-radius: 12px; width: 85%; max-width: 340px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
    .login-card h2 { color: #d32f2f; margin-top: 0; margin-bottom: 5px; }
    .login-card p { font-size: 13px; color: #666; margin-bottom: 20px; }
    .login-input { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 14px; outline: none; }
    .login-btn { background: #d32f2f; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; font-size: 14px; }
  </style>
</head>
<body>

  <div class="login-card">
    <h2>TKR Restaurant</h2>
    <p>Please enter your details to continue</p>
    <input type="text" id="nameInput" class="login-input" placeholder="Full Name">
    <input type="email" id="emailInput" class="login-input" placeholder="Email Address">
    <input type="tel" id="whatsappInput" class="login-input" placeholder="WhatsApp Number">
    <input type="date" id="dobInput" class="login-input">
    <button class="login-btn" onclick="handleLogin()">Login / Signup</button>
  </div>

  <script>
    function handleLogin() {
      let name = document.getElementById('nameInput').value.trim();
      let email = document.getElementById('emailInput').value.trim();
      let whatsapp = document.getElementById('whatsappInput').value.trim();
      let dob = document.getElementById('dobInput').value;

      if (!name || !whatsapp) {
        alert('Please enter at least your name and WhatsApp number!');
        return;
      }

      let userData = { name, email, whatsapp, dob };
      localStorage.setItem('tkr_user', JSON.stringify(userData));
      window.location.href = '/menu';
    }
  </script>
</body>
</html>
